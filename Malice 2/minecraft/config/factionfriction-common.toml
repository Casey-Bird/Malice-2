[general]
	# Default: 5
	# Range: 1 ~ 100
	max_team_members = 10
	# Default: 20
	# Range: 1 ~ 200
	max_colony_members = 20
	# Default: 50
	# Range: 1 ~ 500
	max_country_members = 50
	# Default: 16
	# Range: 1 ~ 10000
	max_claims_team = 30
	# Default: 64
	# Range: 1 ~ 10000
	max_claims_colony = 150
	# Default: 256
	# Range: 1 ~ 10000
	max_claims_country = 256
	allow_entity_riding_in_claims = true
	#Item IDs that place/deploy something (like Superb Warfare's vehicle Container, which deploys via a custom item use rather than normal block placement) and should be blocked from use in claims the player doesn't have access to, same as vanilla boats/minecarts already are. Each entry can be a full item ID like "superbwarfare:container" or a bare mod id to match every item from that mod.
	blocked_placement_item_ids = ["superbwarfare:container"]
	#Entity IDs (mod-added vehicles, e.g. Superb Warfare tanks/helicopters) that get special treatment in claims. Each entry can be a full registry ID like "superbwarfare:tank" to match one entity type, or just a mod id like "superbwarfare" to match every entity that mod adds. Used by both allow_entity_riding_in_claims (lets anyone interact with them) and protect_vehicles_from_damage_in_claims below.
	protected_vehicle_entity_ids = ["superbwarfare"]
	#Whether entities matching protected_vehicle_entity_ids above take no damage from anyone outside the faction that owns the claim they're standing in. Damage from the owning faction (or its own environment - fall/lava/etc.) is unaffected. Only matters for entities that fire LivingAttackEvent - if a mod's vehicle isn't a LivingEntity this won't apply to it.
	protect_vehicles_from_damage_in_claims = true
	#Whether fire is extinguished the instant it spreads into claimed territory from outside the owning faction (unclaimed land or an enemy claim). Fire lit by the owning faction is left alone.
	disable_fire_spread_in_claims = true

[tier_up]
	# Default: 3
	# Range: 1 ~ 100
	members_for_colony = 3
	# Default: 10
	# Range: 1 ~ 100
	members_for_country = 6
	#Faction age required to tier up, measured in internal faction-minutes (an internal server-tick counter, not real-world time or the Minecraft day/night cycle). This means sleeping through the night and server downtime do not affect it - only time spent actually playing on a running server with the faction alive counts.
	# Default: 60
	# Range: 0 ~ 100000
	minutes_required = 60

[auto_borders]
	enabled = true
	# Default: 1
	# Range: 1 ~ 3
	thickness = 1
	# Default: 3
	# Range: 1 ~ 10
	height = 3
	# Default: 20
	# Range: 1 ~ 10000
	blocks_per_diamond = 20
	wall_block = "minecraft:stone_bricks"
	top_block = "minecraft:iron_bars"
	# Default: 24
	# Range: 0 ~ 720
	cooldown_hours = 24
	# Default: 1
	# Range: 0 ~ 64
	unloaded_flat_fee = 1

[war_and_raids]
	# Default: 30
	# Range: 5 ~ 1440
	raid_duration_minutes = 30
	# Default: 3
	# Range: 1 ~ 64
	raid_max_chunks = 3
	# Default: 60
	# Range: 1 ~ 1440
	rally_max_duration_minutes = 60
	# Default: 50
	# Range: 0 ~ 100
	attack_required_online_percent = 50
	# Default: 600
	# Range: 0 ~ 3600
	attack_prep_time_seconds = 600
	# Default: 50
	# Range: 1 ~ 10000
	attack_blocks_required = 50
	# Default: 60
	# Range: 10 ~ 3600
	attack_capture_time_seconds = 60
	# Default: 120
	# Range: 10 ~ 3600
	attack_defense_time_seconds = 120
	# Default: 60
	# Range: 0 ~ 3600
	surrender_delay_seconds = 60
	#Cooldown in hours before a faction can justify a war after breaking an alliance.
	# Default: 24
	# Range: 0 ~ 720
	alliance_break_cooldown_hours = 24
	# Default: 30
	# Range: 0 ~ 100000
	war_justify_minutes = 30
	#Whether blocks destroyed by explosions (TNT, creepers, etc.) in an active attack chunk count toward the blocks-required siege goal, same as manually mined blocks.
	explosions_count_toward_attack_progress = true
	#Max blocks a single player can break per game tick inside the chunk currently being attacked. Vein-mining/auto-mining mods break their whole connected set in the same tick, so leaving this at 1 blocks vein-mining there without touching normal manual mining. Only applies to the active attack chunk - vein mining anywhere else is untouched.
	# Default: 1
	# Range: 1 ~ 64
	attack_chunk_max_breaks_per_tick = 1
	#If true, a player who trips the above limit gets kicked instead of just having the extra breaks denied. Off by default - a denial + chat message is usually enough, and kicking carries a small false-positive risk for laggy players.
	kick_on_attack_chunk_vein_mine = false

[notifications]
	notify_justify_war = true
	notify_raid_start = true
	notify_surrender = true

[rank_limits]
	#Leader and Co-Leader are always capped at 1 each. Citizens (Members) are always unlimited. Set any value here to control how many players can simultaneously hold that rank in a single faction.
	# Default: 1
	# Range: 1 ~ 1
	max_co_leaders = 1
	# Default: 3
	# Range: 1 ~ 1000
	max_commanders = 3
	# Default: 10
	# Range: 1 ~ 1000
	max_military = 10
	# Default: 5
	# Range: 1 ~ 1000
	max_landlords = 5

[ui]
	#Whether the in-game Factions List browser (shows all factions on the server) is available from the main menu.
	enable_faction_list_ui = true

[xaero_map_integration]
	#Whether faction claims are shown as colored chunks on Xaero's Minimap and World Map (if the player has those mods installed). Purely visual - does not use or require Open Parties and Claims.
	show_claims_on_xaero_map = true
	# Default: 40
	# Range: 0 ~ 100
	claim_fill_opacity_percent = 40
	# Default: 80
	# Range: 0 ~ 100
	claim_border_opacity_percent = 80
